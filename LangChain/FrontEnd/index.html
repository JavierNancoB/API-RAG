<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>ChatBot Alloxentric</title>
</head>
<body>
  <h1>Bienvenido a Alloxentric</h1>
  <p>Interfaz de prueba del widget del chatbot.</p>

  <!-- Variables de configuración global (opcional) -->
  <script>
    let idConversacion = null;
    const chatDiv = document.getElementById("chat");

    function appendMessage(text, from) {
      const msg = document.createElement("div");
      msg.className = `msg ${from}`;
      msg.textContent = text;
      chatDiv.appendChild(msg);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const mensaje = input.value;
      input.value = "";
      appendMessage(mensaje, "user");

      const respuesta = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          input: mensaje,
          id_conversacion: idConversacion
        })
      }).then(res => res.json());

      idConversacion = respuesta.id_conversacion;
      appendMessage(respuesta.respuesta, "bot");
    }

    // Enviar mensaje vacío para iniciar conversación
    window.addEventListener("DOMContentLoaded", async () => {
      const respuesta = await fetch("http://localhost:8000/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          input: "", // mensaje vacío
          id_conversacion: null
        })
      }).then(res => res.json());

      idConversacion = respuesta.id_conversacion;
      appendMessage(respuesta.respuesta, "bot");
    });
  </script>

  <!-- Carga del script del widget -->
  <script src="chat.js" async></script>
</body>
</html>
